      CENTRAL_URL: 'http://cloud:8080/events'
      SYNC_INTERVAL: '3'
      DB_PATH: '/data/events.sqlite3'
    volumes:
      - ./pki/runtime/ca/certs/ca.crt:/certs/ca.crt:ro
      - ./pki/runtime/clients/edge-abrigo.crt:/certs/client.crt:ro
      - ./pki/runtime/clients/edge-abrigo.key:/certs/client.key:ro
      - abrigo_data:/data
  sensor-abrigo:
    build: .
    restart: unless-stopped
