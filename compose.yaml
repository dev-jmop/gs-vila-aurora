    restart: unless-stopped
    command: python -m src.mqtt_sensor
    depends_on: [mqtt-escola]
    networks: [field_escola]
    environment:
      SITE: 'escola'
      MQTT_HOST: 'mqtt-escola'
      MQTT_PORT: '8883'
      PUBLISH_INTERVAL: '5'
    volumes:
      - ./pki/runtime/ca/certs/ca.crt:/certs/ca.crt:ro
      - ./pki/runtime/clients/sensor-escola.crt:/certs/client.crt:ro
      - ./pki/runtime/clients/sensor-escola.key:/certs/client.key:ro
  edge-ubs:
    build: .
    restart: unless-stopped
    command: python -m src.mqtt_edge
    depends_on: [mqtt-ubs]
    networks: [field_ubs, wan]
    environment:
      SITE: 'ubs'
      MQTT_HOST: 'mqtt-ubs'
      MQTT_PORT: '8883'
      CENTRAL_URL: 'http://cloud:8080/events'
      SYNC_INTERVAL: '3'
      DB_PATH: '/data/events.sqlite3'
    volumes:
      - ./pki/runtime/ca/certs/ca.crt:/certs/ca.crt:ro
      - ./pki/runtime/clients/edge-ubs.crt:/certs/client.crt:ro
      - ./pki/runtime/clients/edge-ubs.key:/certs/client.key:ro
      - ubs_data:/data
  sensor-ubs:
