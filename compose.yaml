      - ./pki/runtime/clients/sensor-ubs.crt:/certs/client.crt:ro
      - ./pki/runtime/clients/sensor-ubs.key:/certs/client.key:ro
  edge-horta:
    build: .
    restart: unless-stopped
    command: python -m src.mqtt_edge
    depends_on: [mqtt-horta]
    networks: [field_horta, wan]
    environment:
      SITE: 'horta'
      MQTT_HOST: 'mqtt-horta'
      MQTT_PORT: '8883'
      CENTRAL_URL: 'http://cloud:8080/events'
      SYNC_INTERVAL: '3'
      DB_PATH: '/data/events.sqlite3'
    volumes:
      - ./pki/runtime/ca/certs/ca.crt:/certs/ca.crt:ro
      - ./pki/runtime/clients/edge-horta.crt:/certs/client.crt:ro
      - ./pki/runtime/clients/edge-horta.key:/certs/client.key:ro
      - horta_data:/data
  sensor-horta:
    build: .
    restart: unless-stopped
    command: python -m src.mqtt_sensor
    depends_on: [mqtt-horta]
    networks: [field_horta]
    environment:
      SITE: 'horta'
      MQTT_HOST: 'mqtt-horta'
      MQTT_PORT: '8883'
      PUBLISH_INTERVAL: '5'
    volumes:
      - ./pki/runtime/ca/certs/ca.crt:/certs/ca.crt:ro
      - ./pki/runtime/clients/sensor-horta.crt:/certs/client.crt:ro
      - ./pki/runtime/clients/sensor-horta.key:/certs/client.key:ro
  edge-abrigo:
    build: .
    restart: unless-stopped
    command: python -m src.mqtt_edge
    depends_on: [mqtt-abrigo]
    networks: [field_abrigo, wan]
    environment:
      SITE: 'abrigo'
      MQTT_HOST: 'mqtt-abrigo'
