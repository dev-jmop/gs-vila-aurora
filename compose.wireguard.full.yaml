  wan: {}
  field_centro:
    internal: true
  field_escola:
    internal: true
  field_ubs:
    internal: true
  field_horta:
    internal: true
  field_abrigo:
    internal: true
volumes:
  cloud_data: {}
  centro_data: {}
  escola_data: {}
  ubs_data: {}
  horta_data: {}
  abrigo_data: {}
