    - ./pki/runtime/clients/edge-escola.key:/certs/client.key:ro
    entrypoint:
    - /usr/local/bin/va-wg-entrypoint
    cap_add:
    - NET_ADMIN
  sensor-escola:
    build: .
    restart: unless-stopped
    command: python -m src.mqtt_sensor
    depends_on:
    - mqtt-escola
    networks:
    - field_escola
    environment:
      SITE: escola
      MQTT_HOST: mqtt-escola
      MQTT_PORT: '8883'
      PUBLISH_INTERVAL: '5'
    volumes:
