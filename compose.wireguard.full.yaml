name: vila-aurora
services:
  cloud:
    build:
      context: .
      dockerfile: Dockerfile.wg
    command: python -m src.cloud
    restart: unless-stopped
    networks:
    - wan
    ports:
    - 127.0.0.1:8080:8081
    environment:
      DB_PATH: /data/cloud.sqlite3
      WG_ROLE: server
    volumes:
    - ./vpn/runtime/cloud.conf:/wg/wg0.conf:ro
    - cloud_data:/data
    entrypoint:
    - /usr/local/bin/va-wg-entrypoint
    cap_add:
    - NET_ADMIN
  mqtt-centro:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    networks:
    - field_centro
    volumes:
    - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    - ./mqtt/aclfile:/mosquitto/config/aclfile:ro
    - ./pki/runtime/ca/certs/ca.crt:/certs/ca.crt:ro
    - ./pki/runtime/ca/crl/ca.crl:/certs/ca.crl:ro
    - ./pki/runtime/servers/mqtt-centro.crt:/certs/server.crt:ro
    - ./pki/runtime/servers/mqtt-centro.key:/certs/server.key:ro
  mqtt-escola:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    networks:
    - field_escola
    volumes:
    - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    - ./mqtt/aclfile:/mosquitto/config/aclfile:ro
    - ./pki/runtime/ca/certs/ca.crt:/certs/ca.crt:ro
    - ./pki/runtime/ca/crl/ca.crl:/certs/ca.crl:ro
    - ./pki/runtime/servers/mqtt-escola.crt:/certs/server.crt:ro
    - ./pki/runtime/servers/mqtt-escola.key:/certs/server.key:ro
  mqtt-ubs:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    networks:
    - field_ubs
    volumes:
    - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    - ./mqtt/aclfile:/mosquitto/config/aclfile:ro
    - ./pki/runtime/ca/certs/ca.crt:/certs/ca.crt:ro
    - ./pki/runtime/ca/crl/ca.crl:/certs/ca.crl:ro
    - ./pki/runtime/servers/mqtt-ubs.crt:/certs/server.crt:ro
    - ./pki/runtime/servers/mqtt-ubs.key:/certs/server.key:ro
  mqtt-horta:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    networks:
    - field_horta
    volumes:
    - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    - ./mqtt/aclfile:/mosquitto/config/aclfile:ro
    - ./pki/runtime/ca/certs/ca.crt:/certs/ca.crt:ro
    - ./pki/runtime/ca/crl/ca.crl:/certs/ca.crl:ro
    - ./pki/runtime/servers/mqtt-horta.crt:/certs/server.crt:ro
    - ./pki/runtime/servers/mqtt-horta.key:/certs/server.key:ro
  mqtt-abrigo:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    networks:
    - field_abrigo
    volumes:
    - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    - ./mqtt/aclfile:/mosquitto/config/aclfile:ro
    - ./pki/runtime/ca/certs/ca.crt:/certs/ca.crt:ro
    - ./pki/runtime/ca/crl/ca.crl:/certs/ca.crl:ro
    - ./pki/runtime/servers/mqtt-abrigo.crt:/certs/server.crt:ro
    - ./pki/runtime/servers/mqtt-abrigo.key:/certs/server.key:ro
  edge-centro:
    build:
      context: .
      dockerfile: Dockerfile.wg
    restart: unless-stopped
    command: python -m src.mqtt_edge
    depends_on:
    - mqtt-centro
    - cloud
    networks:
    - field_centro
    - wan
    environment:
      SITE: centro
      MQTT_HOST: mqtt-centro
      MQTT_PORT: '8883'
      CENTRAL_URL: http://10.77.0.1:8080/events
      SYNC_INTERVAL: '3'
      DB_PATH: /data/events.sqlite3
      WG_ROLE: edge
    volumes:
    - ./vpn/runtime/edge-centro.conf:/wg/wg0.conf:ro
    - centro_data:/data
    - ./pki/runtime/ca/certs/ca.crt:/certs/ca.crt:ro
    - ./pki/runtime/clients/edge-centro.crt:/certs/client.crt:ro
    - ./pki/runtime/clients/edge-centro.key:/certs/client.key:ro
    entrypoint:
    - /usr/local/bin/va-wg-entrypoint
    cap_add:
    - NET_ADMIN
  sensor-centro:
    build: .
    restart: unless-stopped
    command: python -m src.mqtt_sensor
    depends_on:
    - mqtt-centro
    networks:
    - field_centro
    environment:
      SITE: centro
      MQTT_HOST: mqtt-centro
      MQTT_PORT: '8883'
      PUBLISH_INTERVAL: '5'
    volumes:
    - ./pki/runtime/ca/certs/ca.crt:/certs/ca.crt:ro
    - ./pki/runtime/clients/sensor-centro.crt:/certs/client.crt:ro
    - ./pki/runtime/clients/sensor-centro.key:/certs/client.key:ro
  edge-escola:
    build:
      context: .
      dockerfile: Dockerfile.wg
    restart: unless-stopped
    command: python -m src.mqtt_edge
    depends_on:
    - mqtt-escola
    - cloud
    networks:
    - field_escola
    - wan
    environment:
      SITE: escola
      MQTT_HOST: mqtt-escola
      MQTT_PORT: '8883'
      CENTRAL_URL: http://10.77.0.1:8080/events
      SYNC_INTERVAL: '3'
      DB_PATH: /data/events.sqlite3
      WG_ROLE: edge
    volumes:
    - ./vpn/runtime/edge-escola.conf:/wg/wg0.conf:ro
    - escola_data:/data
    - ./pki/runtime/ca/certs/ca.crt:/certs/ca.crt:ro
